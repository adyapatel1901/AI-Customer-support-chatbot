<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>TechStore AI Support</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="chat-container">

    <div class="header">

        <div>
            <h1>TechStore Support</h1>

            <p>
                AI Customer Support Assistant
            </p>
        </div>

        <span class="status">
            ● Online
        </span>

    </div>


    <div id="chat-box" class="chat-box">

        <div class="message bot">

            <div class="message-name">
                AI Assistant
            </div>

            <div>
                Hello! 👋
                How can I help you today?
            </div>

        </div>

    </div>


    <div class="quick-buttons">

        <button onclick="quickMessage('Where is my order?')">
            Track Order
        </button>

        <button onclick="quickMessage('What is your return policy?')">
            Return Policy
        </button>

        <button onclick="quickMessage('I want a refund.')">
            Refund
        </button>

        <button onclick="requestAgent()">
            Human Agent
        </button>

    </div>


    <div class="input-area">

        <input
            type="text"
            id="user-input"
            placeholder="Type your message..."
            autocomplete="off"
        >

        <button
            id="send-button"
            onclick="sendMessage()">

            Send

        </button>

    </div>

</div>


<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
